name: robot-hand-realtime
services:
  robot-hand:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: robot-hand-ui:local
    container_name: robot-hand-dashboard
    restart: unless-stopped
    init: true
    environment:
      ESP32_WS_URL: ${ESP32_WS_URL:-ws://192.168.4.1:81}
      SIMULATE: ${SIMULATE:-0}
      CONTAINER_HTTP_PORT: "8080"
      CONTAINER_WS_PORT: "8765"
      NO_PROXY: "localhost,127.0.0.1,192.168.4.1"
      no_proxy: "localhost,127.0.0.1,192.168.4.1"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${WS_PORT:-8765}:8765"
    volumes:
      # Host files are reused directly; keeps the full 6-servo project unchanged.
      - ./web_client:/app/web_client:ro
      - ./firmware/models:/app/firmware/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 15s
